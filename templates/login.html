<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {{ negocio.nombre }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='icons/bootstrap-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body style="display:grid; place-items:center; min-height:100vh; padding:20px;">

  <div class="tarjeta" style="max-width:400px; width:100%;">
    <div style="text-align:center; margin-bottom:16px;">
      {% if negocio.logo %}
      <img src="{{ url_for('static', filename='uploads/' ~ negocio.logo) }}" alt="Logo"
           style="width:72px; height:72px; border-radius:18px; object-fit:cover;">
      {% else %}
      <div style="width:72px; height:72px; border-radius:18px; margin:0 auto; background:linear-gradient(135deg,#4f46e5,#0d9488); color:#fff; display:grid; place-items:center; font-size:2rem;">
        <i class="bi bi-shop"></i>
      </div>
      {% endif %}
      <h1 style="margin-top:12px; font-size:1.35rem;">{{ negocio.nombre }}</h1>
    </div>

    {% if error %}
    <div class="tarjeta c-alerta" style="margin-bottom:14px; padding:10px 14px; background:var(--c-suave); color:var(--c); font-weight:600;">{{ error }}</div>
    {% endif %}

    {% if primer_uso %}
    <p class="subtitulo" style="margin-bottom:12px;">Primera vez: creá tu <strong>usuario administrador</strong>.</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="campo"><label>Usuario</label><input type="text" name="usuario" required autofocus></div>
      <div class="campo"><label>Correo (para recuperar el acceso)</label><input type="email" name="email" required></div>
      <div class="campo"><label>Contraseña</label><input type="password" name="password" required></div>
      <div class="campo"><label>Repetir contraseña</label><input type="password" name="password2" required></div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;"><i class="bi bi-check-lg"></i> Crear y entrar</button>
    </form>
    {% else %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="campo"><label>Usuario</label><input type="text" name="usuario" required autofocus></div>
      <div class="campo"><label>Contraseña</label><input type="password" name="password" required></div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
    </form>
    <p style="text-align:center; margin-top:14px;">
      <a href="{{ url_for('auth.recuperar') }}" class="subtitulo">¿Olvidaste el usuario o la clave?</a>
    </p>
    {% endif %}
  </div>

</body>
</html>
{# FIN login.html #}
